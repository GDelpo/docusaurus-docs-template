# ============================================================================
# Docusaurus Docs Template - Docker Compose (Production Standalone)
# ============================================================================
#
# For servers that do NOT use Traefik. Exposes the port directly.
#
# USAGE:
#   docker compose -f docker/docker-compose.prod.standalone.yml up -d --build
#
# ACCESS:
#   http://localhost:8090
#   Or map to port 80 if nothing else is running there.
# ============================================================================

name: docusaurus-docs

services:
  docs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docusaurus-docs:${PROJECT_VERSION:-latest}
    container_name: docusaurus_docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
