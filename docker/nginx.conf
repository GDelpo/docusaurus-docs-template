# ============================================================================
# Docs site - Nginx Configuration
# ============================================================================
# Optimizado para servir un sitio estático Docusaurus
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----- Compresión Gzip -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ----- Cabeceras de seguridad -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----- Cache de assets estáticos -----
    # Docusaurus genera hashes en los nombres de archivo, cache agresivo seguro
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Imágenes
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Fuentes y otros estáticos
    location ~* \.(woff2?|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- Admin SPA fallback -----
    # The admin panel is a React SPA built into Docusaurus.
    # /dashboard/* and /contribuir/* are client-side routed SPAs.
    location /dashboard/ {
        try_files $uri $uri/ /dashboard/index.html;
    }

    location /contribuir/ {
        try_files $uri $uri/ /contribuir/index.html;
    }

    # Legacy /admin/ path fallback (kept for any existing bookmarks)
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ----- Doc assets (downloads/images from published posts) -----
    # Serve files from the docs source directory (bind-mounted).
    # Maps e.g. /inicio/my-post/assets/downloads/file.xlsx
    # to /usr/share/nginx/docs-source/inicio/my-post/assets/downloads/file.xlsx

    # Downloads: force download
    location ~ ^/(.+/assets/downloads/.+)$ {
        alias /usr/share/nginx/docs-source/$1;
        add_header Content-Disposition 'attachment' always;
        access_log off;
    }

    # Images: serve inline
    location ~ ^/(.+/assets/images/.+)$ {
        alias /usr/share/nginx/docs-source/$1;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ----- SPA fallback -----
    # Docusaurus genera HTML para cada ruta, pero necesitamos fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ----- Health check endpoint -----
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ----- Seguridad -----
    # Ocultar archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
