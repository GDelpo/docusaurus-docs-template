<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — My Org Docs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f9fafb 0%, #f3f4f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            margin-top: 1.5rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #e5e7eb;
            animation: slideUp .35s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Header ── */
        .login-header {
            background: linear-gradient(to right, #1d4ed8, #2563eb);
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-header h1 {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 800;
        }

        .login-header p {
            color: #bfdbfe;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        /* ── Form body ── */
        .login-body { padding: 2rem; }

        .form-group { margin-bottom: 1.25rem; }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.375rem;
        }

        .input-wrapper { position: relative; }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            display: flex;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 0.625rem 0.75rem 0.625rem 2.5rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #111827;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:hover  { border-color: #93c5fd; }
        .form-group input:focus  { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.2); }

        .form-hint {
            margin-top: 0.375rem;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .form-hint code {
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            background: #f3f4f6;
            padding: 0 4px;
            border-radius: 3px;
            font-size: 0.7rem;
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            padding: 0.625rem 0.875rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: #1e3a8a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .btn-login:hover  {
            background: #1d40af;
            box-shadow: 0 4px 12px rgba(29,78,216,.3);
            transform: translateY(-1px);
        }
        .btn-login:active { transform: translateY(0); }

        /* ── Footer ── */
        .login-footer {
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-badge {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            color: #6b7280;
        }

        .footer-badge-right { color: #2563eb; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">
                <i class="fa-solid fa-book-open" style="color: white; font-size: 1.375rem;"></i>
            </div>
            <h1>My Org Docs</h1>
            <p>Sign in to continue</p>
        </div>

        <div class="login-body">
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="post" action="/auth/login">
                <input type="hidden" name="redirect" value="{{ redirect }}">

                <div class="form-group">
                    <label for="username">Username or email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="fa-solid fa-user" style="font-size: 0.875rem;"></i>
                        </span>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="e.g. jdoe or jdoe@example.com"
                            required
                            autofocus
                            autocomplete="username"
                        >
                    </div>
                    <p class="form-hint">You can enter your short username <code>jdoe</code> or your full email.</p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="fa-solid fa-lock" style="font-size: 0.875rem;"></i>
                        </span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-sign-in-alt"></i>
                    Sign in
                </button>
            </form>
        </div>

        <div class="login-footer">
            <span class="footer-badge">
                <i class="fa-solid fa-shield-halved" style="color: #60a5fa;"></i>
                Secure connection
            </span>
            <span class="footer-badge footer-badge-right">
                <i class="fa-solid fa-cloud"></i>
                Identity service
            </span>
        </div>

    </div>
</body>
</html>
